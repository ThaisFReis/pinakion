[package]
name = "processo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
hex = "0.4"
kleroterion = { path = "../kleroterion" }
groth16-verifier = { path = "../groth16-verifier" }
